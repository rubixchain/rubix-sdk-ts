name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Verify tag matches package version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          echo "Tag version:     $TAG_VERSION"
          echo "Package version: $PACKAGE_VERSION"
          if [ "$TAG_VERSION" != "$PACKAGE_VERSION" ]; then
            echo "::error::Tag ($TAG_VERSION) does not match package.json version ($PACKAGE_VERSION)."
            exit 1
          fi

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Run tests
        run: npm run test:offline

      - name: Pack tarball
        run: |
          mkdir -p dist-pack
          npm pack --pack-destination dist-pack

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: package
          path: dist-pack/

  github-release:
    name: Create GitHub release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download package
        uses: actions/download-artifact@v4
        with:
          name: package
          path: dist-pack/

      - name: Create release and upload artifacts
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: dist-pack/*

  # Publishes @rubixchain/rubix-sdk with npm trusted publishing (OIDC), so no long-lived token is
  # needed. Trusted publishing must be configured on npmjs.com for the package, pointing at
  # repository rubixchain/rubix-sdk-ts and workflow release.yml.
  #
  # Trusted publishing can only be configured once the package exists. To bootstrap the very
  # first release from CI, add a short-lived granular access token (read-write on the rubixchain
  # org, "Bypass 2FA" enabled) as the NPM_TOKEN secret, then delete it once trusted publishing is set up.
  npm-publish:
    name: Publish to npm
    needs: build
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write # required for trusted publishing and provenance
    steps:
      - name: Download package
        uses: actions/download-artifact@v4
        with:
          name: package
          path: dist-pack/

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Check npm supports trusted publishing
        run: |
          NPM_VERSION="$(npm --version)"
          echo "npm version: $NPM_VERSION"
          if [ "$(printf '%s\n' "11.5.1" "$NPM_VERSION" | sort -V | head -n1)" != "11.5.1" ]; then
            echo "::error::npm $NPM_VERSION is too old for trusted publishing (needs >= 11.5.1)."
            exit 1
          fi

      # Prereleases (e.g. 1.0.0-alpha.1) go to a dist-tag named after their identifier ("alpha"),
      # so that `npm install @rubixchain/rubix-sdk` keeps resolving to the latest stable release
      - name: Determine npm dist-tag
        id: dist-tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [[ "$VERSION" == *-* ]]; then
            PRERELEASE="${VERSION#*-}"
            DIST_TAG="$(echo "$PRERELEASE" | sed -E 's/[^A-Za-z].*$//')"
            DIST_TAG="${DIST_TAG:-next}"
          else
            DIST_TAG="latest"
          fi
          echo "Publishing $VERSION with dist-tag: $DIST_TAG"
          echo "tag=$DIST_TAG" >> "$GITHUB_OUTPUT"

      - name: Publish to npm
        env:
          # Empty unless the bootstrap NPM_TOKEN secret is set; trusted publishing needs no token
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish dist-pack/*.tgz --access public --provenance --tag "${{ steps.dist-tag.outputs.tag }}"
